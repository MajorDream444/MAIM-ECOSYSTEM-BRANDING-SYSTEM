document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rcase}\n.gold{color:#b8912a}.green{color:#1f8a4c}.blue{color:#2a78d6}.orange{color:#e07a2f}\n.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid #1a1a1a}\n.lrow{display:flex;gap:8px;flex-wrap:wrap}\n.crown{width:26px;height:26px;border:1.5px solid #b8912a;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 10px 'Space Mono',monospace;color:#b8912a}\n<\u002Fstyle><\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">MAIM digital ecosystem — sanctuary (public) → workshop (Studio) → back office (operator)<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<!-- ============ 1a PUBLIC FRONT DOOR ============ -->\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>majoraimindset.com — public front door (calm, cinematic, one next step)<\u002Fdiv>\n<div class=\"dv-card wf\" style=\"width:420px\">\n  <div class=\"sec\" style=\"display:flex;align-items:center;gap:10px;padding:12px 20px\">\n    <div class=\"crown\">MD<\u002Fdiv>\n    <div style=\"flex:1\"><div style=\"font-size:14px\">MAJOR AI MINDSET<\u002Fdiv><div class=\"mono green\" style=\"font-size:8px\">live knowledge room<\u002Fdiv><\u002Fdiv>\n    <span class=\"btn gold\" style=\"padding:5px 10px\">Seat →<\u002Fspan>\n    <span class=\"tag\" style=\"position:static\">nav<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">1 · hero<\u002Fspan>\n    <div class=\"mono gold\" style=\"margin-bottom:6px\">AI is the tool. <span class=\"orange\">You are the future.<\u002Fspan><\u002Fdiv>\n    <p class=\"h1\">Stop carrying your ideas in your head. Build from where you are.<\u002Fp>\n    <p class=\"note\">Live learning room for beginners, creators, and community leaders.<\u002Fp>\n    <div class=\"lrow\" style=\"margin-top:10px\"><span class=\"btn gold\">Reserve your seat<\u002Fspan><span class=\"btn\">Explore the ABCs<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;height:4px;margin-top:12px\"><div style=\"flex:1;background:#1f8a4c\"><\u002Fdiv><div style=\"flex:1;background:#e4c568\"><\u002Fdiv><div style=\"flex:1;background:#2a78d6\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\" style=\"display:flex;gap:12px;align-items:center\">\n    <span class=\"tag\">2 · founder welcome<\u002Fspan>\n    <div class=\"ph\" style=\"width:170px;height:96px\">▶ 2–3 min<br>founder video<\u002Fdiv>\n    <div><p class=\"h2\" style=\"margin:0\">A word from Major<\u002Fp><p class=\"note\" style=\"margin:4px 0 0\">Why this room exists, in his own voice. One play button, nothing else.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">3 · why MAIM exists<\u002Fspan>\n    <p class=\"h2\">The hero is not AI.<\u002Fp>\n    <p class=\"note\">Short editorial statement — fear → confidence. Two columns of calm prose, generous space. No feature grid.<\u002Fp>\n    <div class=\"box\" style=\"padding:8px 10px;margin-top:8px\"><span class=\"mono\">pull quote — \"If you can text, you can use AI.\"<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">4 · ABC foundation<\u002Fspan>\n    <p class=\"h2\">A · B · C — the foundation<\u002Fp>\n    <div class=\"lrow\">\n      <div class=\"box\" style=\"flex:1;padding:10px\"><span class=\"dot\" style=\"background:#e4c568\"><\u002Fspan><div style=\"font-size:13px;margin-top:4px\">Awareness<\u002Fdiv><div class=\"note\">Notice the opportunity.<\u002Fdiv><\u002Fdiv>\n      <div class=\"box\" style=\"flex:1;padding:10px\"><span class=\"dot\" style=\"background:#1f8a4c\"><\u002Fspan><div style=\"font-size:13px;margin-top:4px\">Belief<\u002Fdiv><div class=\"note\">You can do this.<\u002Fdiv><\u002Fdiv>\n      <div class=\"box\" style=\"flex:1;padding:10px\"><span class=\"dot\" style=\"background:#2a78d6\"><\u002Fspan><div style=\"font-size:13px;margin-top:4px\">Context<\u002Fdiv><div class=\"note\">Clear in, clear out.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\" style=\"margin:8px 0 0\">Teaser only → full path lives in the Studio. Hint at D Direction · E Experiment as \"what comes next.\"<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">5 · live knowledge room<\u002Fspan>\n    <p class=\"h2\">Next knowledge session<\u002Fp>\n    <div style=\"display:flex;gap:10px\">\n      <div class=\"box\" style=\"flex:1.2;padding:10px\"><div class=\"mono\">Bali / WITA<\u002Fdiv><div style=\"font-size:14px\">Sun, Jul 12 · 7:00 AM<\u002Fdiv><div class=\"mono\" style=\"margin-top:6px\">New York / ET<\u002Fdiv><div style=\"font-size:14px\">Sat, Jul 11 · 7:00 PM<\u002Fdiv><div class=\"mono green\" style=\"margin-top:6px\">(( live on Google Meet ))<\u002Fdiv><\u002Fdiv>\n      <div class=\"box\" style=\"flex:1;padding:10px\"><div class=\"mono\" style=\"margin-bottom:4px\">in the room<\u002Fdiv><div class=\"note\">01 a live idea<br>02 a working example<br>03 a simple action<br>04 replay + follow-up<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">6 · choose your lane<\u002Fspan>\n    <p class=\"h2\">Choose your lane. Build from there.<\u002Fp>\n    <div class=\"lrow\"><span class=\"chip\" style=\"background:#e4c568\">Beginner<\u002Fspan><span class=\"chip\">Creator<\u002Fspan><span class=\"chip\">Entrepreneur<\u002Fspan><span class=\"chip\">Coach<\u002Fspan><span class=\"chip\">Parent<\u002Fspan><span class=\"chip\">Professional<\u002Fspan><\u002Fdiv>\n    <p class=\"note\" style=\"margin:8px 0 0\">Selecting a lane pre-fills the seat form + shapes the Studio path later.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"sec\" style=\"display:flex;gap:12px\">\n    <span class=\"tag\">7 · meet Major<\u002Fspan>\n    <div class=\"ph\" style=\"width:110px;height:120px\">portrait<br>photo<\u002Fdiv>\n    <div><p class=\"h2\" style=\"margin:0\">Major Dream Williams<\u002Fp><p class=\"note\">Founder + translator. South Bronx → Wall Street → AI. Helps people translate AI into real life, business, and legacy.<\u002Fp><div class=\"mono gold\" style=\"margin-top:6px\">woven palm crown mark ◉<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">8 · free starting point<\u002Fspan>\n    <p class=\"h2\">Reserve your free seat<\u002Fp>\n    <div class=\"box\" style=\"padding:10px\">\n      <div class=\"mono\" style=\"margin-bottom:2px\">full name<\u002Fdiv><div class=\"box\" style=\"height:20px;background:#fff\"><\u002Fdiv>\n      <div class=\"mono\" style=\"margin:8px 0 2px\">email<\u002Fdiv><div class=\"box\" style=\"height:20px;background:#fff\"><\u002Fdiv>\n      <div class=\"mono\" style=\"margin:8px 0 2px\">current lane<\u002Fdiv><div class=\"box\" style=\"height:20px;background:#fff;display:flex;align-items:center;padding:0 6px\"><span class=\"note\">Beginner ▾<\u002Fspan><\u002Fdiv>\n      <div class=\"btn gold\" style=\"width:100%;margin-top:10px;box-sizing:border-box\">Register free →<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\" style=\"margin:6px 0 0;text-align:center\">The one clear next step. Everything on the page funnels here.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <span class=\"tag\">9 · product + community preview<\u002Fspan>\n    <div class=\"lrow\">\n      <div class=\"ph\" style=\"flex:1;height:64px\">Studio<br>preview<\u002Fdiv>\n      <div class=\"ph\" style=\"flex:1;height:64px\">products<br>(books, kits)<\u002Fdiv>\n      <div class=\"ph\" style=\"flex:1;height:64px\">community<br>glimpse<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\" style=\"margin:8px 0 0\">Window-shopping only — CTA: \"Enter the Studio →\" (<a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>)<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"sec\" style=\"border-bottom:none;background:#1a1a1a;color:#f0eee9\">\n    <span class=\"tag\" style=\"color:rgba(255,255,255,.4)\">10 · FAQ + footer<\u002Fspan>\n    <p class=\"h2\" style=\"color:#e4c568\">Questions before you join<\u002Fp>\n    <div class=\"note\" style=\"color:rgba(255,255,255,.65)\">Do I need to know AI already? — Is this only for business owners? — What happens after the session?<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,.2);margin-top:12px;padding-top:8px;display:flex;justify-content:space-between;align-items:center\"><span class=\"mono\" style=\"color:rgba(255,255,255,.55)\">MAIM · privacy · terms<\u002Fspan><span class=\"mono gold\">studio.majoraimindset.com →<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1b STUDIO ============ -->\n<div class=\"dv-opt\" id=\"1b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>studio.majoraimindset.com — ABC Studio (active, modular, signed-in)<\u002Fdiv>\n<div class=\"dv-card wf\" style=\"width:520px\">\n  <div class=\"sec\" style=\"display:flex;align-items:center;gap:10px;padding:12px 20px\">\n    <div class=\"crown\">MD<\u002Fdiv>\n    <div style=\"flex:1\"><div style=\"font-size:14px\">MAIM · ABC STUDIO<\u002Fdiv><div class=\"mono blue\" style=\"font-size:8px\">workshop mode<\u002Fdiv><\u002Fdiv>\n    <span class=\"chip\">Dashboard<\u002Fspan><span class=\"chip\">Learn<\u002Fspan><span class=\"chip\">Resources<\u002Fspan><span class=\"chip\">Events<\u002Fspan>\n    <div class=\"crown\" style=\"border-color:#1a1a1a;color:#1a1a1a\">◎<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\" style=\"display:flex;gap:12px\">\n    <span class=\"tag\">1 · personalized dashboard<\u002Fspan>\n    <div style=\"flex:1.4\">\n      <p class=\"h2\" style=\"margin:0\">Welcome back, Keisha 👋<span class=\"mono gold\" style=\"margin-left:8px;text-transform:none\">lane: Creator<\u002Fspan><\u002Fp>\n      <div class=\"box\" style=\"padding:10px;margin-top:8px\">\n        <div class=\"mono\" style=\"margin-bottom:4px\">continue where you left off<\u002Fdiv>\n        <div style=\"font-size:14px\">B2 · Belief — \"You can do this\"
